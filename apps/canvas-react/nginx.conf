server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /canvas-app {
        return 301 /canvas-app/;
    }

    location /canvas-app/ {
        try_files $uri $uri/ /canvas-app/index.html;
    }

    location ~* ^/canvas-app/.*\.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
