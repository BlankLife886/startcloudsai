server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源带 hash，长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # public 中的品牌、模型图标和业务封面没有构建 hash，使用较短缓存；
    # 更新同名文件后最多等待 7 天，也可以在 Cloudflare 单文件清理缓存。
    location ~* ^/(?:brand|icons|sucai)/.+\.(?:avif|gif|ico|jpe?g|png|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 无扩展名的前端路由直接回退到 SPA。否则当路由名恰好与 public
    # 目录同名（例如 /game-art）时，Nginx 会把它当目录并返回 301/403。
    location ~ ^(?:/[^./]+)+/?$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback：其余不存在的前端路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
