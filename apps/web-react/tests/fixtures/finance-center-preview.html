<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>统一账务流水模拟</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#202636;font:13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input{font:inherit}button{border:0;background:none;cursor:pointer;color:inherit}.shell{max-width:1280px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:2px;color:#6959d9;font-weight:700}.top h1{font-size:25px;margin:7px 0}.top p{color:#778196;margin:0}.top-actions{display:flex;gap:8px}.top-actions button,.search{border:1px solid #dce1eb;background:#fff;border-radius:8px;padding:9px 13px}.top-actions .primary{background:#6454d9;color:#fff;border-color:#6454d9}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.kpi,.panel{background:#fff;border:1px solid #e1e5ee;border-radius:13px;box-shadow:0 3px 14px #18213b08}.kpi{padding:17px}.kpi small,.kpi span{display:block;color:#798397}.kpi strong{display:block;font-size:24px;margin:8px 0}.warn strong{color:#d47712}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid #edf0f5}.filters{display:flex;gap:7px;flex-wrap:wrap}.filters button{padding:7px 10px;border-radius:7px;color:#6b7487}.filters button.active{background:#eeeaff;color:#5b48c8;font-weight:600}.search{width:220px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px}.panel-head{padding:16px 18px;display:flex;justify-content:space-between;align-items:center}.panel-head strong{font-size:15px}.muted{color:#8992a2;font-size:12px}.stream{padding:0 18px 12px}.event{display:grid;grid-template-columns:125px 12px minmax(0,1fr) auto auto;gap:12px;align-items:center;min-height:66px;border-top:1px solid #edf0f5}.event-time{color:#8992a2;font-size:11px}.dot{width:9px;height:9px;border-radius:50%;background:#6454d9}.dot.payment{background:#0a9672}.dot.alert{background:#da851c}.event-main{min-width:0}.event-main strong{display:block}.event-main span{display:block;color:#7b8495;font-size:12px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.money{font-weight:650;font-variant-numeric:tabular-nums}.tag{padding:4px 7px;border-radius:6px;background:#eef1f7;color:#687287;font-size:11px;white-space:nowrap}.tag.ok{background:#e4f5ed;color:#087e5e}.tag.warn{background:#fff2db;color:#ae6710}.details{padding:18px}.detail-title{display:flex;justify-content:space-between;align-items:flex-start}.detail-title h2{font-size:18px;margin:0 0 5px}.detail-close{font-size:20px;color:#8992a2}.detail-id{font-family:ui-monospace,monospace;font-size:10px;color:#8992a2;word-break:break-all}.detail-status{margin:17px 0;display:flex;gap:8px;flex-wrap:wrap}.detail-status b{padding:6px 9px;border-radius:7px;background:#e4f5ed;color:#087e5e}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 0;border-block:1px solid #edf0f5}.facts small{display:block;color:#8992a2;margin-bottom:4px}.facts strong{font-size:14px}.subhead{font-size:12px;font-weight:650;margin:20px 0 10px}.timeline{border-left:2px solid #e4e7ef;padding-left:15px}.step{position:relative;margin:0 0 16px}.step:before{content:"";position:absolute;left:-21px;top:3px;width:7px;height:7px;border-radius:50%;background:#6454d9}.step small{color:#8992a2}.step strong{display:block;margin:4px 0}.step p{margin:0;color:#727c8d;line-height:1.5}.action{width:100%;margin-top:18px;padding:10px;border-radius:8px;background:#6454d9;color:#fff}.hidden{display:none!important}@media(max-width:900px){.layout{grid-template-columns:1fr}.details{min-height:0}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.shell{padding:16px}.top{flex-direction:column;gap:15px}.kpis{grid-template-columns:1fr 1fr}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.event{grid-template-columns:72px 10px minmax(0,1fr);gap:8px;padding:10px 0}.event>.money,.event>.tag{grid-column:3}.event-time{font-size:10px}}
</style><body><main class="shell"><header class="top"><div><div class="eyebrow">FINANCE CENTER / MOCK DATA</div><h1>统一账务流水</h1><p>模拟固定额度包、订阅、退款和支付异常的完整生命周期。</p></div><div class="top-actions"><button>导出流水</button><button class="primary">刷新数据</button></div></header><section class="kpis"><article class="kpi"><small>近 7 日订单</small><strong>128</strong><span>已完成 114 笔</span></article><article class="kpi"><small>确认实收</small><strong>¥8,640.00</strong><span>渠道实收金额</span></article><article class="kpi warn"><small>待处理异常</small><strong>3</strong><span>需要后台介入</span></article><article class="kpi"><small>毛利</small><strong>¥5,286.40</strong><span>收入 ¥8,640 · 成本 ¥3,353.60</span></article></section><div class="toolbar"><div class="filters"><button class="active" data-filter="all">全部流水 12</button><button data-filter="payment">支付 5</button><button data-filter="subscription">订阅 4</button><button data-filter="alert">待处理 3</button></div><input class="search" placeholder="搜索用户或订单号"></div><div class="layout"><section class="panel"><div class="panel-head"><strong>账务时间线</strong><span class="muted">按发生时间排序</span></div><div class="stream" id="stream"></div></section><aside class="panel details" id="details"><div class="muted">选择一条流水查看完整账务详情</div></aside></div></main><script>
const data=[
 {kind:'payment',time:'今天 16:42',title:'固定额度包 · 已完成',desc:'20@gmail.com · ¥10.00 → 钱包 +1,000 积分',money:'¥10.00',tag:'已完成',ok:true,id:'ord_8f20a1',detail:{title:'固定额度包 · 1000 积分',user:'20@gmail.com',amount:'¥10.00',received:'¥10.00',wallet:'+1,000 积分',status:'已完成',events:[['16:41:02','创建订单','固定额度包 · 订单金额 ¥10.00'],['16:41:08','支付渠道确认','支付宝实收 ¥10.00'],['16:42:01','钱包发放','已发放 1,000 积分'],['16:42:02','订单完成','账务已闭环']]}},
 {kind:'payment',time:'今天 15:18',title:'订阅 · 专业版 30 天',desc:'226@qq.com · ¥39.00 → 订阅已生效',money:'¥39.00',tag:'已完成',ok:true,id:'ord_7b19c2',detail:{title:'专业版订阅 · 30 天',user:'226@qq.com',amount:'¥39.00',received:'¥39.00',wallet:'订阅权益已生效',status:'已完成',events:[['15:17:20','创建订单','专业版 · 固定金额 ¥39.00'],['15:17:31','渠道确认','微信实收 ¥39.00'],['15:18:00','订阅生效','有效期 30 天'],['15:18:00','权益发放','每日积分额度已配置']]}},
 {kind:'alert',time:'今天 14:06',title:'支付对账 · 待补充渠道单号',desc:'3035125226@qq.com · 渠道结果未绑定',money:'¥10.00',tag:'待处理',id:'ord_5003e7',detail:{title:'支付对账异常',user:'3035125226@qq.com',amount:'¥10.00',received:'尚未确认',wallet:'未发放',status:'待处理',events:[['14:04:11','创建订单','固定额度包 · 订单金额 ¥10.00'],['14:06:03','对账异常','渠道单号未记录'],['14:06:03','进入人工处理','请核对渠道后台后选择“确认未建单”或补录渠道单号']] }},
 {kind:'subscription',time:'昨天 22:14',title:'订阅升级 · 专业版',desc:'20@gmail.com · 差额 ¥19.00 · 原权益抵扣',money:'¥19.00',tag:'已完成',ok:true,id:'ord_4d82aa',detail:{title:'订阅升级 · 专业版',user:'20@gmail.com',amount:'¥19.00',received:'¥19.00',wallet:'升级权益已生效',status:'已完成',events:[['昨天 22:10','升级报价','原权益抵扣 ¥20.00'],['昨天 22:11','创建订单','升级差额 ¥19.00'],['昨天 22:14','支付确认','支付宝实收 ¥19.00'],['昨天 22:14','订阅变更','升级已完成']]}},
 {kind:'payment',time:'昨天 18:30',title:'固定额度包 · 已完成',desc:'20@gmail.com · ¥50.00 → 钱包 +5,500 积分',money:'¥50.00',tag:'已完成',ok:true,id:'ord_19ac31',detail:{title:'固定额度包 · 5500 积分',user:'20@gmail.com',amount:'¥50.00',received:'¥50.00',wallet:'+5,500 积分',status:'已完成',events:[['18:29:03','创建订单','固定额度包 · ¥50.00'],['18:30:20','支付确认','支付宝实收 ¥50.00'],['18:30:21','钱包发放','已发放 5,500 积分']]}}
];
const stream=document.querySelector('#stream'),details=document.querySelector('#details');
function render(items=data){stream.innerHTML=items.map((x,i)=>`<button class="event" data-index="${data.indexOf(x)}"><time class="event-time">${x.time}</time><i class="dot ${x.kind}"></i><span class="event-main"><strong>${x.title}</strong><span>${x.desc}</span></span><b class="money">${x.money}</b><span class="tag ${x.ok?'ok':x.kind==='alert'?'warn':''}">${x.tag}</span></button>`).join('');stream.querySelectorAll('.event').forEach(b=>b.onclick=()=>show(data[Number(b.dataset.index)]));}
function show(x){const d=x.detail;details.innerHTML=`<div class="detail-title"><div><h2>${d.title}</h2><div class="detail-id">${x.id}</div></div><button class="detail-close" onclick="details.innerHTML='<div class=muted>选择一条流水查看完整账务详情</div>'">×</button></div><div class="detail-status"><b>${d.status}</b><span class="tag">${d.user}</span></div><div class="facts"><div><small>订单金额</small><strong>${d.amount}</strong></div><div><small>确认实收</small><strong>${d.received}</strong></div><div><small>钱包 / 权益</small><strong>${d.wallet}</strong></div><div><small>当前状态</small><strong>${d.status}</strong></div></div><div class="subhead">完整处理时间线</div><div class="timeline">${d.events.map(e=>`<div class="step"><small>${e[0]}</small><strong>${e[1]}</strong><p>${e[2]}</p></div>`).join('')}</div>${x.kind==='alert'?'<button class="action" onclick="alert(\'模拟：打开支付对账处理窗口\')">处理这笔异常</button>':''}`}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));const f=b.dataset.filter;render(f==='all'?data:data.filter(x=>f==='alert'?x.kind==='alert':x.kind===f));});document.querySelector('.search').oninput=e=>{const q=e.target.value.toLowerCase();render(data.filter(x=>(x.desc+x.id+x.title).toLowerCase().includes(q)))};render();
</script></body></html>
