<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>无限画布 · 生成卡片设计对比</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--ink);background:var(--page);--page:#edf0f5;--surface:#fff;--ink:#242839;--muted:#677186;--line:#e2e6ef;--soft:#f4f6fb;--accent:#6555de;--green:#067959;--greenbg:#e5f5ed;--shadow:0 6px 24px #202b4910}body.dark{--page:#131722;--surface:#202634;--ink:#e9edf7;--muted:#abb6cb;--line:#384155;--soft:#293144;--accent:#ad9fff;--green:#76e4b6;--greenbg:#1e4237;--shadow:none}button,input,select,textarea{font:inherit}button,select,input[type=checkbox]{cursor:pointer}button{color:inherit}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px}button[aria-pressed=true]{background:var(--accent);color:var(--surface);border-color:var(--accent)}.top{padding:28px 32px 22px;background:var(--surface);border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:750}.top h1{font-size:23px;margin:8px 0}.top p{font-size:13px;color:var(--muted);margin:0;line-height:1.7}.controls{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:20px}.choices{display:flex;gap:5px;flex-wrap:wrap}.width{display:flex;align-items:center;gap:10px;font-size:13px}.width input{width:140px;accent-color:var(--accent)}main{padding:28px 24px 60px;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px}.gallery{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;align-items:flex-start}.option{width:min(var(--card-width,360px),100%);container-type:inline-size}.caption{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}.caption h2{font-size:15px;margin:0}.caption small{color:var(--muted);font-size:11px}.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;font-size:12px}.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 14px;gap:4px}.tabs span{flex:1;text-align:center;padding:13px 2px;color:var(--muted)}.tabs .active{color:var(--green);font-weight:700;box-shadow:inset 0 -2px var(--green)}.tabs .disabled{opacity:.55}.head{padding:18px 18px 14px}.title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.mark{display:grid;place-items:center;width:34px;height:34px;flex-shrink:0;border-radius:10px;background:#e8e3ff;color:#5843c7;font-size:17px}.title strong{font-size:16px;letter-spacing:-.3px}.title .sub{font-size:11px;color:var(--muted);margin-top:4px}.badge{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:11px;background:var(--greenbg);color:var(--green);padding:5px 7px;border-radius:6px;white-space:nowrap}.section{padding:0 18px 16px;min-width:0}.section-title{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px;font-size:12px;font-weight:650}.section-title small{font-weight:400;color:var(--muted);font-size:11px}.model{width:100%;margin-top:12px}.model,select,input[type=number],textarea{border:1px solid var(--line);color:var(--ink);background:var(--soft);border-radius:8px;padding:9px 10px;min-width:0;max-width:100%}select{width:100%;font-size:12px}.seg{display:flex;gap:5px;margin:0 0 12px}.seg button{flex:1;font-size:11px;padding:7px 4px}.seg button[aria-pressed=true]{background:var(--soft);color:var(--accent);border-color:var(--accent)}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field{min-width:0}.field>span{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.extra{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}.toggle{display:flex;align-items:center;gap:7px;font-size:12px}.toggle input{accent-color:var(--accent)}.stepper{display:flex;align-items:center;gap:8px}.stepper button{width:28px;height:28px;padding:0;border-radius:7px}.stepper output{min-width:25px;text-align:center}.exact{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.exact input{width:100%}.size-hint{margin:10px 0 0;color:var(--muted);font-size:11px;line-height:1.6}.references{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ref{border-radius:9px;border:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:7px;min-width:0}.thumb{flex-shrink:0;width:40px;height:42px;border-radius:6px;background:linear-gradient(145deg,#e8ddd0,#fbf6eb);display:grid;place-items:center}.bottle{display:block;width:16px;height:25px;background:#977554;border-radius:3px 3px 5px 5px;position:relative;box-shadow:3px 3px 6px #765c4430}.bottle:before{content:"";position:absolute;width:12px;height:6px;left:2px;top:-5px;background:#333b42;border-radius:2px}.bottle:after{content:"SERUM";position:absolute;top:8px;left:1px;background:#faf6eb;color:#685b4a;font-size:4px;width:14px;text-align:center;padding:3px 0}.ref small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.ref .name{font-size:11px;overflow-wrap:anywhere}.refs-note{color:var(--muted);font-size:10px;margin-top:8px}.prompt{width:100%;resize:vertical;min-height:91px;line-height:1.8;font-size:12px;display:block}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:7px;gap:8px}.footer{padding:14px 18px 16px;border-top:1px solid var(--line)}.timing{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}.action{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;background:#6652da;color:white;border:0;min-height:40px;font-weight:650;border-radius:10px}.action .cost{font-size:11px;font-weight:450;border-left:1px solid #ffffff50;padding-left:10px}.fine{font-size:10px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.5}.notice{font-size:11px;color:var(--green);min-height:0;line-height:1.6;margin-top:8px}.b .head{background:linear-gradient(115deg,#6042d1,#8160ea);color:#fff;padding-bottom:18px}.b .head .sub{color:#e8ddff}.b .badge{background:#ffffff20;color:white}.b .model{background:#ffffff15;border-color:#ffffff40;color:white}.b .model option{color:#242839;background:white}.b .tabs{border:0;background:var(--soft)}.b .body{padding-top:16px}.b .fields{grid-template-columns:1fr 1fr}.b .field:last-child{grid-column:1/-1}.b .section{margin:0 12px 12px;padding:12px;background:var(--soft);border-radius:10px}.b select,.b textarea,.b input[type=number]{background:var(--surface)}.b .footer{border:0;padding-top:0}.b .action{background:#087d5d}.c .head{padding-bottom:16px;border-bottom:1px solid var(--line)}.c .mark{background:#dcf5ee;color:#07845f}.c .tabs{padding:0 18px}.c .body{display:grid;grid-template-columns:1fr;padding-top:16px}.c .fields{grid-template-columns:1fr}.c .field{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:10px}.c .field>span{margin:0}.c .footer{background:var(--soft)}.c .action{background:#087d5d}.c .model{background:transparent}.c .section-title{text-transform:uppercase;letter-spacing:.4px}.c .section-title:before{content:"";width:3px;height:12px;background:#13b387;border-radius:3px;margin-right:-3px}.c .section-title small{margin-left:auto}.c .asset-section{border-top:1px solid var(--line);padding-top:16px}.hide{display:none!important}@container (max-width:310px){.fields{grid-template-columns:1fr 1fr}.fields .field:last-child{grid-column:1/-1}.references{grid-template-columns:1fr}.title strong{font-size:14px}.head,.section,.footer{padding-left:12px;padding-right:12px}.badge{margin-left:0}.meta{flex-wrap:wrap}.seg{flex-wrap:wrap}.caption small{display:none}}@container (min-width:520px){.c .body{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}.c .asset-section{border-top:0;border-left:1px solid var(--line);padding-top:0}.c .prompt{min-height:143px}.c .footer{display:grid;grid-template-columns:1fr 220px;gap:0 20px;align-items:center}.c .timing{margin:0}.c .fine{grid-column:2}.c .notice{grid-column:1/-1}.b .fields{grid-template-columns:repeat(3,1fr)}.b .field:last-child{grid-column:auto}}@media(max-width:600px){.top{padding:20px 16px}main{padding:20px 12px}.top h1{font-size:20px}.controls{gap:12px}.width{flex-wrap:wrap}.gallery{gap:24px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<body><header class="top"><div class="eyebrow">CANVAS / DESIGN REVIEW</div><h1>生成卡片 · 三种布局方向</h1><p>全部使用同一组演示数据。可切换尺寸模式、参数和主题；预览按钮不会调用模型或扣费。</p><div class="controls"><div class="choices" aria-label="版本"><button data-view="all" aria-pressed="true">并排比较</button><button data-view="a" aria-pressed="false">A · 清晰面板</button><button data-view="b" aria-pressed="false">B · 色彩分区</button><button data-view="c" aria-pressed="false">C · 自适应工作台</button></div><label class="width">卡片宽度 <input id="width" type="range" min="280" max="760" value="360"><output id="width-value">360 px</output></label><button id="theme">切换深色</button></div></header><main><div class="gallery" id="gallery"></div></main>
<template id="card"><section class="option"><div class="caption"><h2></h2><small></small></div><article class="card"><div class="tabs"><span class="active">◈ 生图</span><span title="本预览展示生图配置">文本</span><span class="disabled" title="暂不可用">视频</span><span class="disabled" title="暂不可用">音频</span></div><header class="head"><div class="title"><span class="mark">✳</span><div><strong>产品展示图</strong><div class="sub">生成配置 · #03</div></div><span class="badge">✓ 已完成</span></div><select class="model" aria-label="模型"><option>gpt-image-2 · 32 积分 / 张</option><option>gpt-image-2 · 高质量 · 48 积分 / 张</option></select></header><div class="body"><section class="section parameter-section"><div class="section-title">生成参数 <small>图片输出</small></div><div class="seg"><button data-mode="ratio" aria-pressed="true">比例与档位</button><button data-mode="exact" aria-pressed="false">精确宽高</button></div><div class="fields"><label class="field"><span>质量</span><select aria-label="质量"><option>低</option><option selected>中</option><option>高</option></select></label><label class="field ratio-field"><span>宽高比</span><select aria-label="宽高比"><option>自动</option><option>1:1</option><option selected>4:3</option><option>16:9</option><option>9:16</option></select></label><label class="field ratio-field"><span>分辨率</span><select aria-label="分辨率"><option selected>1K</option><option>2K</option><option>4K</option></select></label></div><div class="exact"><label class="field"><span>宽度 / px</span><input aria-label="宽度" type="number" min="256" max="4096" value="1536"></label><label class="field"><span>高度 / px</span><input aria-label="高度" type="number" min="256" max="4096" value="1024"></label></div><p class="size-hint">按 4:3 比例生成 · 1K 档位</p><div class="extra"><label class="toggle"><input type="checkbox">透明背景</label><div class="stepper"><button data-step="-1" aria-label="减少张数">−</button><output>1 张</output><button data-step="1" aria-label="增加张数">＋</button></div></div></section><section class="section asset-section"><div class="section-title">输入素材 <small>2 张参考图</small></div><div class="references"><div class="ref"><span class="thumb"><i class="bottle"></i></span><div class="name">@图1 产品白底图<small>1536 × 1024 · PNG</small></div></div><div class="ref"><span class="thumb" style="background:linear-gradient(135deg,#dce9ed,#aec3cb)"><i class="bottle"></i></span><div class="name">@图2 氛围参考<small>2048 × 1536 · JPG</small></div></div></div><div class="refs-note">参考图为 CSS 绘制的演示素材</div><div class="section-title" style="margin-top:16px">提示词 <small>已组装 ✓</small></div><textarea class="prompt" aria-label="提示词">以 @图1 为产品主体，保留瓶身和标签细节。参考 @图2 的柔和侧光与空间氛围，制作干净的电商产品展示图，产品居中，避免添加额外文字。</textarea><div class="meta"><span class="chars"></span><span>2 个图片引用 · 可直接编辑</span></div></section></div><footer class="footer"><div class="timing"><span>✓ 生成于 16:46:59</span><span>用时 <b>1m 26s</b></span></div><button class="action"><span>↻ 重新生成</span><span class="cost">32 积分</span></button><div class="fine">费用预估 · 确认生成后扣除</div><div class="notice" role="status"></div></footer></article></section></template>
<script>
const variants=[['a','A · 清晰面板','轻边界 / 参数优先'],['b','B · 色彩分区','彩色头部 / 信息分组'],['c','C · 自适应工作台','宽屏双栏 / 窄屏纵排']];
for(const [id,title,desc] of variants){const root=document.querySelector('#card').content.firstElementChild.cloneNode(true);root.dataset.variant=id;root.querySelector('h2').textContent=title;root.querySelector('.caption small').textContent=desc;root.querySelector('.card').classList.add(id);if(id==='b')root.querySelector('.head').before(root.querySelector('.tabs'));document.querySelector('#gallery').append(root);let count=1,mode='ratio';const q=s=>root.querySelector(s);const update=()=>{q('.chars').textContent=q('.prompt').value.length+' 字';q('.stepper output').textContent=count+' 张';q('[data-step="-1"]').disabled=count===1;q('[data-step="1"]').disabled=count===4;const price=q('.model').selectedIndex?48:32;q('.cost').textContent=price*count+' 积分';if(mode==='exact'){const [w,h]=Array.from(root.querySelectorAll('.exact input')).map(x=>Number(x.value));q('.size-hint').textContent=w>=256&&w<=4096&&h>=256&&h<=4096?`${w} × ${h} px · 精确尺寸`:'宽高需在 256–4096 px 之间';q('.action').disabled=!(w>=256&&w<=4096&&h>=256&&h<=4096)}else{q('.size-hint').textContent=`按 ${q('[aria-label="宽高比"]').value} 比例生成 · ${q('[aria-label="分辨率"]').value} 档位`;q('.action').disabled=false}};root.addEventListener('input',update);root.addEventListener('change',update);root.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{count=Math.max(1,Math.min(4,count+Number(b.dataset.step)));update()});root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;root.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));root.querySelectorAll('.ratio-field').forEach(x=>x.classList.toggle('hide',mode==='exact'));q('.exact').style.display=mode==='exact'?'grid':'none';update()});q('.action').onclick=()=>q('.notice').textContent='预览：参数已确认。不会发起真实生成或扣费。';update()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelectorAll('.option').forEach(x=>x.classList.toggle('hide',b.dataset.view!=='all'&&x.dataset.variant!==b.dataset.view))});document.querySelector('#width').oninput=e=>{document.documentElement.style.setProperty('--card-width',e.target.value+'px');document.querySelector('#width-value').textContent=e.target.value+' px'};document.querySelector('#theme').onclick=e=>{document.body.classList.toggle('dark');e.target.textContent=document.body.classList.contains('dark')?'切换浅色':'切换深色'};
</script>
<link rel="stylesheet" href="./canvas-card-designs-v2.css">
<script src="./canvas-card-designs-v2.js"></script>

<script src="./canvas-card-reference.js"></script>
</body></html>
