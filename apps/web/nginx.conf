server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源带 hash，长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 无扩展名的前端路由直接回退到 SPA。否则当路由名恰好与 public
    # 目录同名（例如 /game-art）时，Nginx 会把它当目录并返回 301/403。
    location ~ ^(?:/[^./]+)+/?$ {
        try_files /index.html =404;
    }

    # SPA fallback：其余不存在的前端路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
