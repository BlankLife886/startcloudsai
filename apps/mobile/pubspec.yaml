name: starcloudsai_mobile
description: "StarCloudsAI mobile client for AI creation and artwork management."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_markdown_plus: 1.0.12
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.0.0
  flutter_staggered_grid_view: ^0.7.0
  gal: ^2.3.3
  go_router: ^17.5.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  path_provider: ^2.1.6
  package_info_plus: ^10.2.1
  permission_handler: 12.0.3
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  speech_to_text: ^7.4.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/images/
