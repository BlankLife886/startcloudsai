name: startcloudsai-integrated-candidate

services:
  server:
    image: startcloudsai-integrated-candidate-server:${RELEASE_ID:-candidate}
    build: ../../apps/server
    restart: unless-stopped
    env_file: ${INTEGRATED_APP_ENV_FILE:-.env.integrated}
    environment:
      DATABASE_URL: postgres://${STARCLOUD_DB_USER:-starclouds}:${STARCLOUD_DB_PASSWORD:?STARCLOUD_DB_PASSWORD must be set}@postgres:5432/${STARCLOUD_DB_NAME:-starclouds}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      C2A_BASE_URL: http://chatgpt2api:80
      C2A_API_KEY: ${CHATGPT2API_AUTH_KEY:?CHATGPT2API_AUTH_KEY must be set}
      C2A_CALLBACK_SECRET: ${CHATGPT2API_AUTH_KEY:?CHATGPT2API_AUTH_KEY must be set}
      C2A_ALLOW_PRIVATE: "true"
      TRUSTED_PROXIES: 172.31.10.253/32
      GOMEMLIMIT: ${SERVER_GOMEMLIMIT:-640MiB}
      DB_MAX_CONNS: ${SERVER_DB_MAX_CONNS:-10}
      DB_MIN_CONNS: ${SERVER_DB_MIN_CONNS:-1}
      API_PPROF_ADDR: 127.0.0.1:6060
    command: ["/app/server", "serve"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      data: {}
      api:
        aliases: [candidate-server]
      outbound: {}
    mem_limit: 768m
    cpus: 0.75
    cpuset: "0-3"
    pids_limit: 220
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s

  gateway:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    ports:
      - ${CANDIDATE_GATEWAY_BIND:-127.0.0.1}:${CANDIDATE_GATEWAY_PORT:-8081}:80
    volumes:
      - ../nginx.conf:/etc/nginx/templates/startcloudsai.conf:ro
    command:
      - /bin/sh
      - -c
      - |
        sed 's#http://server:8000#http://candidate-server:8000#g' /etc/nginx/templates/startcloudsai.conf > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    networks:
      api:
        ipv4_address: 172.31.10.253
      frontend: {}
      edge: {}
    mem_limit: 128m
    cpus: 0.15
    cpuset: "0-3"
    pids_limit: 100

networks:
  data:
    external: true
    name: startcloudsai-integrated_data
  api:
    external: true
    name: startcloudsai-integrated_api
  outbound:
    external: true
    name: startcloudsai-integrated_outbound
  frontend:
    external: true
    name: startcloudsai-integrated_frontend
  edge:
    external: true
    name: startcloudsai-integrated_edge
