name: startcloudsai-integrated

services:
  postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD must be set}
      STARCLOUD_DB_NAME: ${STARCLOUD_DB_NAME:-starclouds}
      STARCLOUD_DB_USER: ${STARCLOUD_DB_USER:-starclouds}
      STARCLOUD_DB_PASSWORD: ${STARCLOUD_DB_PASSWORD:?STARCLOUD_DB_PASSWORD must be set}
      CHATGPT2API_DB_NAME: ${CHATGPT2API_DB_NAME:-chatgpt2api}
      CHATGPT2API_DB_USER: ${CHATGPT2API_DB_USER:-chatgpt2api}
      CHATGPT2API_DB_PASSWORD: ${CHATGPT2API_DB_PASSWORD:?CHATGPT2API_DB_PASSWORD must be set}
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - work_mem=8MB
      - -c
      - wal_compression=on
    volumes:
      - pg18_integrated_data:/var/lib/postgresql
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [data]
    mem_limit: 1280m
    cpus: 1.25
    cpuset: "0-3"
    pids_limit: 250

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_integrated_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    mem_limit: 384m
    cpus: 0.40
    cpuset: "0-3"
    pids_limit: 120

  chatgpt2api:
    build:
      context: ${CHATGPT2API_SOURCE_DIR:?CHATGPT2API_SOURCE_DIR must point to the clean 3.0 integration checkout}
      dockerfile: Dockerfile
    image: chatgpt2api-startcloud:${CHATGPT2API_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${CHATGPT2API_DB_USER:-chatgpt2api}:${CHATGPT2API_DB_PASSWORD:?CHATGPT2API_DB_PASSWORD must be set}@postgres:5432/${CHATGPT2API_DB_NAME:-chatgpt2api}
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:?CHATGPT2API_AUTH_KEY must be set}
      CHATGPT2API_BASE_URL: ${CHATGPT2API_BASE_URL:-http://127.0.0.1:3000}
      CHATGPT2API_THREAD_TOKENS: ${CHATGPT2API_THREAD_TOKENS:-120}
      DATABASE_POOL_SIZE: ${CHATGPT2API_DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${CHATGPT2API_DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_TIMEOUT_SECONDS: ${CHATGPT2API_DATABASE_POOL_TIMEOUT_SECONDS:-30}
      TZ: Asia/Shanghai
    volumes:
      - chatgpt2api_integrated_data:/app/data
    ports:
      - ${CHATGPT2API_BIND:-127.0.0.1}:${CHATGPT2API_PORT:-3000}:80
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/version', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s
    networks: [data, upstream, outbound]
    mem_limit: 1536m
    cpus: 1.25
    cpuset: "0-3"
    pids_limit: 500

  server:
    build: ../../apps/server
    restart: unless-stopped
    env_file: ${INTEGRATED_APP_ENV_FILE:-.env.integrated}
    environment:
      DATABASE_URL: postgres://${STARCLOUD_DB_USER:-starclouds}:${STARCLOUD_DB_PASSWORD:?STARCLOUD_DB_PASSWORD must be set}@postgres:5432/${STARCLOUD_DB_NAME:-starclouds}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      C2A_BASE_URL: http://chatgpt2api:80
      C2A_API_KEY: ${CHATGPT2API_AUTH_KEY:?CHATGPT2API_AUTH_KEY must be set}
      GOMEMLIMIT: ${SERVER_GOMEMLIMIT:-640MiB}
      DB_MAX_CONNS: ${SERVER_DB_MAX_CONNS:-10}
      DB_MIN_CONNS: ${SERVER_DB_MIN_CONNS:-1}
      API_PPROF_ADDR: 127.0.0.1:6060
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["/app/server", "serve"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [data, api, outbound]
    mem_limit: 768m
    cpus: 0.75
    cpuset: "0-3"
    pids_limit: 220
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 20s

  worker:
    build: ../../apps/server
    restart: unless-stopped
    stop_grace_period: 15m
    env_file: ${INTEGRATED_APP_ENV_FILE:-.env.integrated}
    environment:
      DATABASE_URL: postgres://${STARCLOUD_DB_USER:-starclouds}:${STARCLOUD_DB_PASSWORD:?STARCLOUD_DB_PASSWORD must be set}@postgres:5432/${STARCLOUD_DB_NAME:-starclouds}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      C2A_BASE_URL: http://chatgpt2api:80
      C2A_API_KEY: ${CHATGPT2API_AUTH_KEY:?CHATGPT2API_AUTH_KEY must be set}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-32}
      WORKER_POLL_CONCURRENCY: ${WORKER_POLL_CONCURRENCY:-8}
      WORKER_IMAGE_MEMORY_MIB: ${WORKER_IMAGE_MEMORY_MIB:-1280}
      ASSISTANT_OCR_ENABLED: ${ASSISTANT_OCR_ENABLED:-true}
      ASSISTANT_OCR_PDFTOPPM_PATH: /usr/bin/pdftoppm
      ASSISTANT_OCR_TESSERACT_PATH: /usr/bin/tesseract
      GOMEMLIMIT: ${WORKER_GOMEMLIMIT:-1900MiB}
      DB_MAX_CONNS: ${WORKER_DB_MAX_CONNS:-8}
      DB_MIN_CONNS: ${WORKER_DB_MIN_CONNS:-1}
      WORKER_PPROF_ADDR: 127.0.0.1:6060
    depends_on:
      server:
        condition: service_healthy
      redis:
        condition: service_healthy
      chatgpt2api:
        condition: service_healthy
    command: ["/app/server", "worker"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [data, upstream, outbound]
    mem_limit: 2304m
    cpus: 1.75
    cpuset: "0-3"
    pids_limit: 400

  web:
    build:
      context: ../..
      dockerfile: apps/web-react/Dockerfile
    restart: unless-stopped
    networks: [frontend]
    mem_limit: 192m
    cpus: 0.25
    cpuset: "0-3"
    pids_limit: 100

  admin:
    build: ../../apps/admin
    restart: unless-stopped
    networks: [frontend]
    mem_limit: 192m
    cpus: 0.25
    cpuset: "0-3"
    pids_limit: 100

  gateway:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    ports:
      - ${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8080}:80
    volumes:
      - ../nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_started
      admin:
        condition: service_started
    networks:
      api:
        ipv4_address: 172.31.10.254
      frontend: {}
      edge: {}
    mem_limit: 128m
    cpus: 0.15
    cpuset: "0-3"
    pids_limit: 100

volumes:
  pg18_integrated_data:
  redis_integrated_data:
  chatgpt2api_integrated_data:

networks:
  data:
    internal: true
  api:
    internal: true
    ipam:
      config:
        - subnet: 172.31.10.0/24
  frontend:
    internal: true
  upstream:
    internal: true
  outbound:
  edge:
