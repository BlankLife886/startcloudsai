# Add these directives inside the existing `server {}` for starcloudisai.com.
# Keep the existing certificate and HTTPS redirect generated by Baota.

include /www/wwwroot/startcloudsai/deploy/cloudflare/cloudflare-realip.conf;

location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Send one trusted address, not the untrusted inbound X-Forwarded-For chain.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 60s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
}
