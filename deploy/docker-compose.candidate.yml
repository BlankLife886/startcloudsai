services:
  server:
    image: startcloudsai-candidate-server:${RELEASE_ID:-candidate}
    build: ${RELEASE_DIR:?set RELEASE_DIR to the extracted release directory}/apps/server
    restart: unless-stopped
    env_file: ${RELEASE_DIR}/.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      SUB2API_BASE_URL: ${SUB2API_BASE_URL:-http://host.docker.internal:8080}
      TRUSTED_PROXIES: ${CANDIDATE_TRUSTED_PROXIES:-172.30.11.254/32}
      GOMEMLIMIT: ${SERVER_GOMEMLIMIT:-900MiB}
      DB_MAX_CONNS: ${SERVER_DB_MAX_CONNS:-10}
      DB_MIN_CONNS: ${SERVER_DB_MIN_CONNS:-1}
      API_PPROF_ADDR: 127.0.0.1:6060
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["/app/server", "serve"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks: [data, api, outbound]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s

  worker:
    profiles: ["worker"]
    image: startcloudsai-candidate-server:${RELEASE_ID:-candidate}
    restart: unless-stopped
    stop_grace_period: 15m
    env_file: ${RELEASE_DIR}/.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-32}
      WORKER_IMAGE_MEMORY_MIB: ${WORKER_IMAGE_MEMORY_MIB:-1024}
      ASSISTANT_OCR_ENABLED: ${ASSISTANT_OCR_ENABLED:-true}
      ASSISTANT_OCR_PDFTOPPM_PATH: /usr/bin/pdftoppm
      ASSISTANT_OCR_TESSERACT_PATH: /usr/bin/tesseract
      GOMEMLIMIT: ${WORKER_GOMEMLIMIT:-1700MiB}
      DB_MAX_CONNS: ${WORKER_DB_MAX_CONNS:-5}
      DB_MIN_CONNS: ${WORKER_DB_MIN_CONNS:-1}
      WORKER_PPROF_ADDR: 127.0.0.1:6060
    depends_on:
      server:
        condition: service_healthy
    command: ["/app/server", "worker"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks: [data, outbound]
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 300

  web:
    image: startcloudsai-candidate-web:${RELEASE_ID:-candidate}
    build:
      context: ${RELEASE_DIR}
      dockerfile: apps/web-react/Dockerfile
    restart: unless-stopped
    networks: [frontend]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100

  admin:
    image: startcloudsai-candidate-admin:${RELEASE_ID:-candidate}
    build: ${RELEASE_DIR}/apps/admin
    restart: unless-stopped
    networks: [frontend]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100

  gateway:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    ports:
      - "${CANDIDATE_GATEWAY_BIND:-127.0.0.1}:${CANDIDATE_GATEWAY_PORT:-8081}:80"
    volumes:
      - ${RELEASE_DIR}/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_started
      admin:
        condition: service_started
    networks:
      api:
        ipv4_address: ${CANDIDATE_GATEWAY_IP:-172.30.11.254}
      frontend: {}
      edge: {}
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100

networks:
  data:
    external: true
    name: ${PRODUCTION_COMPOSE_PROJECT:-startcloudsai}_data
  outbound:
    external: true
    name: ${PRODUCTION_COMPOSE_PROJECT:-startcloudsai}_outbound
  api:
    internal: true
    ipam:
      config:
        - subnet: ${CANDIDATE_API_SUBNET:-172.30.11.0/24}
  frontend:
    internal: true
  edge:
