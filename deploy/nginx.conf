map $http_x_forwarded_proto $upstream_scheme {
    default $scheme;
    https https;
}

# 公网入口（宝塔 Nginx）会覆盖 X-Real-IP。Gateway 只绑定 127.0.0.1，
# 因此这里把入口确认过的单一地址传给 Go，避免多层 proxy_add_x_forwarded_for
# 让 Gin 把 Docker 网桥或 Cloudflare 边缘节点误判为用户 IP。
map $http_x_real_ip $client_real_ip {
    default $http_x_real_ip;
    "" $remote_addr;
}

map $http_x_forwarded_proto $hsts_header {
    default "";
    https "max-age=31536000; includeSubDomains";
}

map $uri $content_security_policy {
    default "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'";
    ~^/canvas(?:/|$) "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' blob: 'wasm-unsafe-eval'; connect-src 'self' https: http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'";
}

server {
    listen 80;
    server_name _;
    client_max_body_size 1m;
    server_tokens off;

    # Docker 会在容器重建后分配新 IP。通过内置 DNS 按请求解析服务名，
    # 避免 gateway 继续把流量发往 web/admin/server 的旧容器地址。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $server_upstream http://server:8000;
    set $admin_upstream http://admin:80;
    set $web_upstream http://web:80;

    add_header Content-Security-Policy $content_security_policy always;
    add_header Strict-Transport-Security $hsts_header always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # 容器间回调只允许直连 server；公网网关永不代理内部路由。
    location ^~ /internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass $server_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_read_timeout 300s;
    }

    # OpenAI-compatible image API. Keep this namespace separate from the SPA
    # and the legacy /api envelope; Go applies the stricter per-route limits.
    location ~ ^/v1(?:/|$) {
        client_max_body_size 33m;
        proxy_pass $server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        # Retrying a POST may create a second paid task. Clients can retry
        # explicitly with their original Idempotency-Key.
        proxy_next_upstream off;
        proxy_intercept_errors off;
        error_page 413 = @openai_request_too_large;
        error_page 502 = @openai_bad_gateway;
        error_page 503 = @openai_unavailable;
        error_page 504 = @openai_gateway_timeout;
    }

    location @openai_request_too_large {
        internal;
        default_type application/json;
        add_header X-Request-ID $request_id always;
        add_header X-Should-Retry "false" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 413 '{"error":{"message":"请求体超过允许的大小（最多 33 MiB）","type":"invalid_request_error","param":null,"code":"request_too_large"}}';
    }

    location @openai_bad_gateway {
        internal;
        default_type application/json;
        add_header X-Request-ID $request_id always;
        add_header X-Should-Retry "false" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 502 '{"error":{"message":"图片服务暂时不可用；如需重试，请使用同一 Idempotency-Key","type":"server_error","param":null,"code":"bad_gateway"}}';
    }

    location @openai_unavailable {
        internal;
        default_type application/json;
        add_header X-Request-ID $request_id always;
        add_header X-Should-Retry "false" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 503 '{"error":{"message":"图片服务暂时不可用；如需重试，请使用同一 Idempotency-Key","type":"server_error","param":null,"code":"service_unavailable"}}';
    }

    location @openai_gateway_timeout {
        internal;
        default_type application/json;
        add_header X-Request-ID $request_id always;
        add_header X-Should-Retry "false" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 504 '{"error":{"message":"等待图片任务超时；请使用同一 Idempotency-Key 重试，避免重复提交","type":"server_error","param":null,"code":"gateway_timeout"}}';
    }

    # 公告实时更新，事件到达后立即转发给已打开的页面。
    location = /api/v1/announcements/events {
        proxy_pass $server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location ^~ /api/v1/assistant/ {
        client_max_body_size 20m;
        proxy_pass $server_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location = /api/v1/uploads {
        client_max_body_size 16m;
        proxy_pass $server_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_read_timeout 300s;
    }

    # 轮播原图由运营自行处理，保留原始文件并流式转发。
    location = /api/v1/admin/home-banners/images {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_pass $server_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_read_timeout 300s;
    }

    location = /api/v1/admin/prompt-import-batches/upload {
        client_max_body_size 11m;
        proxy_pass $server_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_read_timeout 300s;
    }

    # 画布模板导出包最多 128 MiB；额外空间留给 document 元数据和 multipart 边界。
    # Go 服务仍会按具体子路由执行更严格的 2 MiB/9 MiB/130 MiB 限制。
    location ^~ /api/v1/admin/canvas-workflow-templates {
        client_max_body_size 131m;
        proxy_pass $server_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_read_timeout 300s;
    }

    location ^~ /api/v1/canvas-projects {
        client_max_body_size 6m;
        proxy_pass $server_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_read_timeout 300s;
    }

    # 后台提示词封面允许 8MB；额外 1MB 留给 multipart 元数据。
    location ~ ^/api/v1/admin/prompts/[^/]+/cover$ {
        client_max_body_size 9m;
        proxy_pass $server_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_read_timeout 300s;
    }

    location = /admin {
        return 301 /admin/;
    }

    # 注意：proxy_pass 不带 URI（无尾斜杠），原样保留 /admin/ 前缀转发给 admin 容器
    location /admin/ {
        proxy_pass $admin_upstream;
    }

    location = /canvas-app {
        return 301 /canvas;
    }

    location ^~ /canvas-app/ {
        return 301 /canvas;
    }

    location / {
        proxy_pass $web_upstream;
    }
}
